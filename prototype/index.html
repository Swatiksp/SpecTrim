@layer base {

    margin: 0;
    background: #0c0d0f;
    color: #ecedef;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  html, body {
    overflow-x: clip;
  }
  button {
    cursor: pointer;
    text-align: left;
  }

    cursor: not-allowed;
  }

:root {
  --fast: 180ms;
  --base: 280ms;
  --slow: 440ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.75, 0);
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.3;
  }
}
@keyframes row-in {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes hl {
  from {
    background: #222659;
  }
  to {
    background: transparent;
  }
}
@keyframes tick-draw {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.spin {
  animation: spin 0.8s linear infinite;
}
.pulse {
  animation: pulse-dot 1s ease-in-out infinite;
}
.new-entry {
  animation: row-in var(--base) var(--ease-out), hl 1.2s ease-out 0s;
}
.tick-draw {
  transform-box: fill-box;
  transform-origin: center;
  animation: tick-draw var(--base) var(--ease-out) both;
}
.thin-scroll::-webkit-scrollbar {

}
.thin-scroll::-webkit-scrollbar-track {
  background: #1b1d20;

}

  background: #6a7079;
  border-radius: 2px;
}
.noscroll::-webkit-scrollbar {
  display: none;
}
.noscroll {
  scrollbar-width: none;
}

  }

  }
}
@keyframes roll-up {
  from {
    transform: translateY(60%);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes roll-down {
  from {
    transform: translateY(-60%);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.roll-up {
  animation: roll-up var(--base) var(--ease-out);
}
.roll-down {
  animation: roll-down var(--base) var(--ease-out);
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.fade-in {
  animation: fade-in var(--base) var(--ease-out) both;
}
@keyframes avatar-rise {
  from {
    transform: translateY(112px);
  }
  to {
    transform: translateY(0);
  }
}
.avatar-rise {

  }
}
